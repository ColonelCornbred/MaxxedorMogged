<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Maxxed or Mogged</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #1A1A2E;
      color: #F5A623;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: #aaa; }
    a { color: #F5A623; }
  </style>
</head>
<body>
  <h1>Maxxed or Mogged</h1>
  <p id="status">Verifying your account...</p>

  <script>
    // Grab params from both hash (#) and query string (?)
    const hash = window.location.hash.substring(1);
    const query = window.location.search.substring(1);
    const params = new URLSearchParams(hash || query);

    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token') || '';
    const token_hash = params.get('token_hash');
    const type = params.get('type') || 'signup';

    let deepLink = null;

    if (access_token) {
      deepLink = `reachorsettle://auth/callback#access_token=${access_token}&refresh_token=${refresh_token}&type=${type}`;
    } else if (token_hash) {
      deepLink = `reachorsettle://auth/callback?token_hash=${token_hash}&type=${type}`;
    }

    if (deepLink) {
      document.getElementById('status').textContent = 'Opening app...';
      window.location.href = deepLink;

      // Fallback message if app doesn't open
      setTimeout(() => {
        document.getElementById('status').innerHTML =
          'If the app did not open, <a href="' + deepLink + '">tap here</a>.';
      }, 2000);
    } else {
      document.getElementById('status').textContent =
        'No verification token found. Please try the link from your email again.';
    }
  </script>
</body>
</html>
